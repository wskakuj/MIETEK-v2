name: Build MIETEK v2 by FORESTLY

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pywebview pythonnet pyinstaller python-docx

    - name: Build "MIETEK v2 by FORESTLY.exe"
      shell: cmd
      run: pyinstaller --noconfirm --onefile --windowed --icon "forestly.ico" --name "MIETEK v2 by FORESTLY" --add-data "webapp;webapp" --add-data "VERSION;." --add-data "docs;docs" --collect-all webview --collect-all clr_loader --hidden-import pythonnet --hidden-import clr --hidden-import szablony --hidden-import raporty_api app/main.py

    - name: Upload EXE jako artefakt (do pobrania z zakładki Actions)
      uses: actions/upload-artifact@v4
      with:
        name: MIETEK-v2-by-FORESTLY
        path: dist/MIETEK v2 by FORESTLY.exe
        if-no-files-found: error

    - name: Dołącz EXE do wydania (przy tagu v*)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/MIETEK v2 by FORESTLY.exe
        body_path: RELEASE_NOTES.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
