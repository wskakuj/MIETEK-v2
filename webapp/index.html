<!DOCTYPE html>
<html lang="pl">
<head>
<script>document.documentElement.setAttribute("data-theme","light");</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIETEK v2 by FORESTLY</title>
<style>
:root{
  --ziel:#2dd4a7; --ziel-c:#22b8cf; --ziel-l:rgba(45,212,167,.14); --tlo:#0b0f14; --panel:rgba(20,26,34,.86);
  --linia:rgba(255,255,255,.09); --tekst:#eef2f6; --muted:#aeb9c6; --akcent:#38bdf8; --err:#fb7185; --errbg:rgba(251,113,133,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;color:var(--tekst);background:var(--tlo);
     display:flex;flex-direction:column;height:100vh;overflow:hidden}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;cursor:pointer}
code{font-family:"Consolas",monospace}

/* ---------- topbar ---------- */
header.top{background:linear-gradient(135deg,var(--ziel),var(--ziel-c));color:#fff;padding:10px 16px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:5}
header.top h1{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
header.top h1 .logo{width:40px;height:40px;border-radius:11px;object-fit:contain;display:block;background:#fff;padding:4px}
#drop{border:1.5px dashed rgba(255,255,255,.6);border-radius:8px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:13px;transition:.15s}
#drop.nad{background:rgba(255,255,255,.18);border-color:#fff}
#drop label{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:3px 10px;cursor:pointer}
#drop label:hover{background:rgba(255,255,255,.28)}
#load-input{display:none}
#status{flex:1;min-width:200px;font-size:12.5px;opacity:.95}
#btn-zapisz{background:#fff;color:var(--ziel);border:0;border-radius:7px;padding:8px 16px;font-weight:650}
#btn-zapisz:disabled{opacity:.5;cursor:default}
#btn-zapisz:not(:disabled):hover{background:#eef7ef}
#btn-excel{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:7px;padding:8px 14px;font-weight:600}
#btn-excel:hover{background:rgba(255,255,255,.28)}

/* ---------- układ ---------- */
.glowny{flex:1;display:flex;min-height:0}
aside{width:290px;background:var(--panel);border-right:1px solid var(--linia);display:flex;flex-direction:column;min-height:0}
aside .szuk{padding:10px}
aside .szuk input{width:100%;padding:7px 10px;border:1px solid var(--linia);border-radius:7px;font:inherit}
#lista-wydz{overflow:auto;flex:1}
.wydz-item{display:grid;grid-template-columns:44px 54px 78px 1fr;gap:6px;padding:7px 12px;border-bottom:1px solid #eef1ee;cursor:pointer;font-size:13px;align-items:center}
.wydz-item:hover{background:var(--ziel-l)}
.wydz-item.sel{background:var(--ziel-l);box-shadow:inset 3px 0 0 var(--ziel)}
.w-kod{font-weight:700;font-family:Consolas,monospace}
.w-nr{color:#b8860b;font-family:Consolas,monospace;text-align:right;font-weight:650}
.w-pow{color:var(--muted);text-align:right}
.w-sied{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pusto,.pusto-mini{padding:18px;color:var(--muted);text-align:center}
.pusto-mini{padding:8px;font-size:12.5px}

main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
nav.zakladki{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--linia);padding:0 12px;flex-wrap:wrap}
.zakladka{border:0;background:none;padding:11px 15px;color:var(--muted);border-bottom:2.5px solid transparent;font-weight:600;font-size:13.5px}
.zakladka:hover{color:var(--tekst)}
.zakladka.akt{color:var(--ziel);border-bottom-color:var(--ziel)}
#widok{flex:1;overflow:auto;padding:16px}

/* ---------- karty ---------- */
.karta{background:var(--panel);border:1px solid var(--linia);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.karta-naglowek{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.karta-naglowek h2{font-size:16px;color:var(--ziel)}
.pow-badge{background:var(--ziel-l);color:var(--ziel);border-radius:20px;padding:3px 12px;font-weight:650;font-size:13px}
h3.grp{margin:14px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--linia);padding-bottom:4px}

.siatka-pol{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pole{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.pole.szer{grid-column:span 2}
.pole>span{color:var(--muted);font-weight:600}
.pole input,.pole select,select,input[type=text]{padding:6px 8px;border:1px solid var(--linia);border-radius:6px;font:inherit;background:#fff;width:100%}
.pole input:focus,.pole select:focus{outline:2px solid var(--ziel-l);border-color:var(--ziel-c)}

/* ---------- builder ---------- */
.przel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.min{padding:4px 10px;border:1px solid var(--linia);border-radius:6px;background:#fff;font-size:12.5px}
.min:hover{border-color:var(--ziel-c);color:var(--ziel)}
.min.akcja{background:var(--ziel);color:#fff;border-color:var(--ziel)}
.min.akcja:hover{background:var(--ziel-c);color:#fff}
.min.akt{background:var(--ziel-l);border-color:var(--ziel-c);color:var(--ziel);font-weight:700}
.kafelki{display:flex;flex-direction:column;gap:8px}
.kafelek{border:1px solid var(--linia);border-left:3px solid var(--ziel-c);border-radius:9px;background:#fcfdfc}
.kaf-naglowek{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--ziel-l);border-radius:8px 8px 0 0}
.kaf-typ{font-weight:650;font-size:12.5px;color:var(--ziel)}
.kaf-str{font-family:Consolas,monospace;font-size:12.5px;color:#444;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kaf-akcje{display:flex;gap:3px}
.kaf-akcje button{border:1px solid var(--linia);background:#fff;border-radius:5px;width:24px;height:24px;line-height:1;font-size:12px}
.kaf-akcje button:hover{border-color:var(--err);color:var(--err)}
.kaf-cialo{padding:9px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.kaf-cialo select,.kaf-cialo input{padding:5px 7px;border:1px solid var(--linia);border-radius:5px;font:inherit;width:auto}
.kaf-cialo .szeroki{width:100%}
.sklad{display:flex;flex-direction:column;gap:5px}
.sklad-row{display:flex;gap:5px;align-items:center}
.sklad-row .udzial{width:52px}
.sklad-row .gat{width:82px}
.sklad-row button{border:1px solid var(--linia);background:#fff;border-radius:5px;width:24px;height:26px}
.wiek-row{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px}
.wiek-row input{width:60px}
.dodaj{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.chip{border:1px dashed var(--ziel-c);background:#fff;color:var(--ziel);border-radius:20px;padding:4px 12px;font-size:12.5px}
.chip:hover{background:var(--ziel-l)}
.mini-info{color:var(--muted);font-size:12.5px}

.podglad{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--linia)}
.podglad h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
.siatka-op{font-family:Consolas,monospace;font-size:12px;border:1px solid var(--linia);border-radius:7px;overflow:hidden}
.op-cell{display:flex;gap:8px;padding:3px 8px;border-bottom:1px solid #eef1ee;white-space:pre;background:#fff}
.op-cell:last-child{border-bottom:0}
.op-cell .nr{color:#b9c4b8;width:12px;flex:none}
.op-cell.nadmiar{background:var(--errbg);color:var(--err)}
.dlug{margin-top:6px;font-size:12px;color:var(--muted)}
.dlug .nad{color:var(--err)}
.druk-op{font-family:Consolas,monospace;font-size:12px;border:1px solid var(--linia);border-radius:7px;padding:8px;background:#fff}
.druk-op .dl{white-space:pre;color:#333}

/* ---------- tabele ---------- */
.tabela-wrap{overflow:auto;border:1px solid var(--linia);border-radius:9px}
table.tabela{border-collapse:collapse;width:100%;font-size:12.5px}
table.tabela th,table.tabela td{border-bottom:1px solid #eef1ee;padding:4px 6px;text-align:left;white-space:nowrap}
table.tabela thead th{background:var(--ziel-l);color:var(--ziel);position:sticky;top:0;font-size:11.5px}
table.tabela input,table.tabela select{padding:4px 5px;border:1px solid var(--linia);border-radius:5px;font:inherit;width:100%;min-width:46px}
table.tabela input[type=checkbox]{width:auto;min-width:0}
.r-tabela td{white-space:nowrap}
.filtr{padding:6px 10px;border:1px solid var(--linia);border-radius:7px;font:inherit;min-width:200px}

/* ---------- słowniki ---------- */
.slowniki{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.sl-blok{border:1px solid var(--linia);border-radius:9px;overflow:hidden}
.sl-blok h3{background:var(--ziel-l);color:var(--ziel);padding:7px 10px;font-size:13px;display:flex;justify-content:space-between}
.sl-blok .lic{color:var(--muted);font-weight:400}
.sl-lista{max-height:260px;overflow:auto;padding:6px}
.sl-item{padding:2px 6px;font-size:12.5px;border-bottom:1px solid #f2f5f2}
.sl-item code{color:var(--ziel);font-weight:700;display:inline-block;min-width:38px}

/* ---------- wydruk ---------- */
.druk-karta{max-width:1100px}
.druk{font-size:11px}
.druk-tytul{font-weight:700;text-align:center;font-size:13px;margin-bottom:2px}
.druk-podtytul{display:flex;justify-content:space-between;margin-bottom:8px;font-size:11.5px}
table.druk-tab{border-collapse:collapse;width:100%;font-size:10px}
table.druk-tab th,table.druk-tab td{border:1px solid #999;padding:2px 4px;vertical-align:top}
table.druk-tab thead th{background:#eef1ee;text-align:center;font-weight:650}
table.druk-tab td.c{text-align:center}table.druk-tab td.r{text-align:right}
.dl-tab{font-family:Consolas,monospace;white-space:pre;font-size:9.5px}
.dl-tab.rej{color:#555}
td.opis{min-width:230px}
td.wsk{font-size:9px;white-space:normal;min-width:90px}

@media print{
  body{overflow:visible;height:auto;background:#fff}
  header.top,aside,nav.zakladki,.no-print{display:none!important}
  .glowny{display:block}
  #widok{overflow:visible;padding:0}
  .karta{border:0;box-shadow:none;margin:0;padding:0}
  .druk-karta{max-width:none}
}
@media(max-width:820px){
  aside{width:200px}.podglad{grid-template-columns:1fr}
}
.kaf-cialo .wiek{width:58px}
.sklad-row .zakres{color:var(--muted);font-size:12px;min-width:58px;text-align:center}
.karta textarea{outline:none}
.karta textarea:focus{border-color:var(--ziel-c);box-shadow:0 0 0 2px var(--ziel-l)}
.op-etykieta{font-size:11.5px;font-weight:650;color:var(--ziel);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.op-etykieta.kont{color:#8a6d00}
.siatka-op.kont{border-color:#e0c98a}
<style>
.wydruki-layout{display:flex;gap:14px;align-items:flex-start;padding:12px}
.raport-lista{display:flex;flex-direction:column;gap:6px;min-width:250px;max-width:300px;flex:0 0 auto}
.raport-btn{text-align:left;border:1px solid var(--linia);background:#fff;border-radius:8px;padding:8px 11px;font:inherit;cursor:pointer}
.raport-btn:hover{background:var(--ziel-l)}
.raport-btn.akt{background:var(--ziel-l);box-shadow:inset 3px 0 0 var(--ziel);font-weight:600}
.raport-podglad{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.raport-info{font-size:12.5px;color:var(--muted);margin-bottom:6px;align-self:stretch}
.raport-scroll{width:100%;overflow:auto;background:#fff;border:1px solid var(--linia);border-radius:8px;padding:10px;display:block}
pre.raport{margin:0 auto;width:max-content;font-family:"Consolas","DejaVu Sans Mono",monospace;white-space:pre;line-height:1.08;font-size:var(--fs-screen,12px)}
pre.raport.brk{break-after:page;page-break-after:always}
.sortlab{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.wask{text-align:center}
.rej-tabela{table-layout:fixed;width:max-content}
.rej-tabela th,.rej-tabela td{padding:2px 4px;vertical-align:top}
.rej-tabela input{font:12px/1.2 "Consolas",monospace;width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 3px}
.rej-tabela input:hover{border-color:var(--linia)}
.rej-tabela input:focus{border-color:var(--ziel);background:#fff}
.rej-tabela tbody tr:nth-child(even) td{background:rgba(127,140,160,.07)}
.rej-tabela tbody tr.rej-aktywny td{background:rgba(45,212,167,.20)!important;box-shadow:inset 2px 0 0 var(--ziel)}
.rej-tabela tr.wsp td{background:#fafcf9}
.dz-cell{white-space:normal}
.dz-chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--linia);border-radius:6px;padding:1px 3px;margin:1px 3px 1px 0;background:#fff}
.dz-chip input{border:0;width:auto;padding:1px 2px}
.dz-chip input.nrd{width:54px}.dz-chip input.od{width:26px}.dz-chip input.pd{width:24px}.dz-chip input.pw{width:56px}
.dz-chip button{border:0;background:transparent;color:var(--err);cursor:pointer;font-size:11px;padding:0 2px}
.dodaj-dz{font-size:11px;color:var(--ziel);background:transparent;border:1px dashed var(--ziel);border-radius:6px;cursor:pointer;padding:1px 6px}
.rej-tabela th{position:relative}
th .rsz{position:absolute;top:0;right:-3px;width:9px;height:100%;cursor:col-resize;user-select:none;z-index:2}
th .rsz::after{content:"";position:absolute;top:3px;bottom:3px;right:3px;width:2px;background:var(--ziel-c);opacity:.5;border-radius:2px}
th:hover .rsz::after{opacity:1;background:var(--ziel);width:3px}
.rej-tabela tr.wsp td{background:#e6f1e8}
.rej-tabela tr.grp td{border-left:2px solid var(--ziel-c);border-right:2px solid var(--ziel-c)}
.rej-tabela tr.grp-start td{border-top:2px solid var(--ziel-c)}
.rej-tabela tr.grp-end td{border-bottom:2px solid var(--ziel-c)}
td.akcje{white-space:nowrap}
td.akcje button{margin-left:2px}
.rej-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rej-panel{margin-top:12px;border:1px solid var(--linia);border-radius:10px;padding:10px;background:rgba(127,140,160,.06)}
.rej-panel h3{margin:0 0 8px;font-size:13px;color:var(--ziel)}
.rej-panel-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.rej-panel .pole>span{font-size:11px}
input[type=date]{font:inherit}
@media (max-width:980px){
 .rej-toolbar{align-items:stretch}
 .rej-toolbar .filtr{min-width:0;width:100%}
 .rej-toolbar .sortlab{justify-content:space-between;width:100%}
}
@media print{
 @page{margin:8mm 4mm}
 header.top,aside,.zakladki,.no-print,#btn-excel,#btn-zapisz,.raport-lista{display:none!important}
 .glowny,main{display:block}
 .raport-podglad,.raport-scroll{display:block;overflow:visible;border:0;padding:0;width:auto}
 pre.raport{max-height:none;border:0;margin:0 auto;font-size:var(--fs-print,9px)}
 body{overflow:visible;height:auto}
 .karta{border:0;box-shadow:none}
}

/* =====================================================================
   MIETEK v2 by FORESTLY — skórka „Aurora Glass" (spójna z ekosystemem FORESTLY)
   Paleta i komponenty odwzorowane z webapp/style.css FORESTLY.
   ===================================================================== */
:root{
  --bg-grad-1:rgba(45,212,167,.10); --bg-grad-2:rgba(56,163,248,.08);
  --accent-grad:linear-gradient(135deg,#2dd4a7 0%,#22b8cf 55%,#38a3f8 100%);
  --card:rgba(24,31,41,.92);
  --ziel:#2dd4a7; --ziel-c:#22b8cf; --ziel-l:rgba(45,212,167,.14);
  --tlo:#0b0f14; --panel:rgba(20,26,34,.86); --linia:rgba(255,255,255,.09);
  --tekst:#eef2f6; --muted:#aeb9c6; --akcent:#38bdf8; --err:#fb7185; --errbg:rgba(251,113,133,.14);
}
[data-theme="light"]{
  --bg-grad-1:rgba(13,150,104,.16); --bg-grad-2:rgba(37,99,235,.10);
  --card:rgba(255,255,255,.98);
  --ziel:#0d9668; --ziel-c:#2563eb; --ziel-l:rgba(13,150,104,.12);
  --tlo:#eef1f6; --panel:rgba(255,255,255,.92); --linia:rgba(15,30,50,.10);
  --tekst:#17212b; --muted:#5b6b7c; --akcent:#2563eb; --err:#e11d48; --errbg:rgba(225,29,72,.10);
}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--tlo);color:var(--tekst)}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 600px at 8% -10%,var(--bg-grad-1),transparent 60%),
    radial-gradient(1000px 700px at 105% 15%,var(--bg-grad-2),transparent 55%),
    radial-gradient(800px 800px at 50% 120%,var(--bg-grad-1),transparent 60%);
}
/* ---------- topbar ---------- */
header.top{background:var(--panel);backdrop-filter:blur(14px);color:var(--tekst);
  border-bottom:1px solid var(--linia);box-shadow:none;padding:11px 20px;gap:14px}
header.top h1{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:18px;gap:10px;color:var(--tekst);line-height:1.15}
header.top h1 .logo{width:42px;height:42px;border-radius:13px;display:block;object-fit:contain;background:#fff;padding:4px;
  box-shadow:0 6px 18px rgba(45,212,167,.35)}
#app-name{font-weight:800;letter-spacing:.2px;
  background:linear-gradient(90deg,var(--ziel),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.app-sub{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-left:2px;white-space:nowrap}
#drop{border:1.5px dashed var(--linia);border-radius:12px;color:var(--muted)}
#drop.nad{background:var(--ziel-l);border-color:var(--ziel)}
#drop label{background:rgba(127,140,160,.10);border:1px solid var(--linia);border-radius:9px;color:var(--tekst);padding:4px 11px}
#drop label:hover{background:rgba(127,140,160,.18)}
#status{color:var(--muted);font-size:12.5px}
#btn-theme{background:rgba(127,140,160,.10);color:var(--tekst);border:1px solid var(--linia);border-radius:10px;padding:8px 13px;font-weight:600}
#btn-theme:hover{background:rgba(127,140,160,.18)}
#btn-zapisz{background:var(--accent-grad);color:#06231b;border:0;border-radius:10px;padding:9px 18px;font-weight:700;box-shadow:0 6px 20px rgba(45,212,167,.35)}
#btn-zapisz:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px)}
#btn-excel{background:rgba(127,140,160,.10);color:var(--tekst);border:1px solid var(--linia);border-radius:10px;padding:9px 15px;font-weight:600}
#btn-excel:hover{background:rgba(127,140,160,.18)}
/* ---------- układ ---------- */
aside{background:var(--panel);backdrop-filter:blur(14px);border-right:1px solid var(--linia);width:300px}
aside .szuk input{background:rgba(127,140,160,.07);border:1px solid var(--linia);color:var(--tekst);border-radius:10px}
aside .szuk input:focus{outline:none;border-color:var(--ziel);box-shadow:0 0 0 3.5px rgba(45,212,167,.16)}
.wydz-item{border-bottom:1px solid var(--linia)}
.wydz-item:hover{background:var(--ziel-l)}
.wydz-item.sel{background:var(--ziel-l);box-shadow:inset 3px 0 0 var(--ziel)}
.w-kod{color:var(--tekst)}
.w-nr{color:var(--ziel)}
.w-pow,.w-sied{color:var(--muted)}
nav.zakladki{background:var(--panel);backdrop-filter:blur(14px);border-bottom:1px solid var(--linia);gap:4px}
.zakladka{color:var(--muted);border-bottom:2.5px solid transparent;font-weight:650}
.zakladka:hover{color:var(--tekst)}

<script src="./mietek-utils.js"></script>
<script>
/* =========================================================================
   MIETEK — rdzeń (działa w Node i w przeglądarce)
   - kodowanie CP852 (DOS Latin-2) — pełne polskie znaki
   - odczyt i zapis plików DBF (dBASE III/IV, jak w MIETKU)
   - model opisu taksacyjnego OP_TAX (siatka 7 x 35 znaków)
   - składanie/parsowanie segmentów opisu (skróty z SOPIS)
   ========================================================================= */
(function (root) {
  "use strict";

  /* ----------------------------------------------------------- CP852 ---- */
  var CP852_HI = ["Ç","ü","é","â","ä","ů","ć","ç","ł","ë","Ő","ő","î","Ź","Ä","Ć","É","Ĺ","ĺ","ô","ö","Ľ","ľ","Ś","ś","Ö","Ü","Ť","ť","Ł","×","č","á","í","ó","ú","Ą","ą","Ž","ž","Ę","ę","¬","ź","Č","ş","«","»","░","▒","▓","│","┤","Á","Â","Ě","Ş","╣","║","╗","╝","Ż","ż","┐","└","┴","┬","├","─","┼","Ă","ă","╚","╔","╩","╦","╠","═","╬","¤","đ","Đ","Ď","Ë","ď","Ň","Í","Î","ě","┘","┌","█","▄","Ţ","Ů","▀","Ó","ß","Ô","Ń","ń","ň","Š","š","Ŕ","Ú","ŕ","Ű","ý","Ý","ţ","´","­","˝","˛","ˇ","˘","§","÷","¸","°","¨","˙","ű","Ř","ř","■"," "];
  var CP852_REV = {};
  for (var i = 0; i < CP852_HI.length; i++) CP852_REV[CP852_HI[i]] = 0x80 + i;

  function cp852Decode(bytes) {
    var out = "";
    for (var i = 0; i < bytes.length; i++) {
      var b = bytes[i];
      out += b < 0x80 ? String.fromCharCode(b) : CP852_HI[b - 0x80];
    }
    return out;
  }
  function cp852Encode(str) {
    var arr = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charAt(i), code = str.charCodeAt(i);
      if (code < 0x80) arr.push(code);
      else if (CP852_REV.hasOwnProperty(c)) arr.push(CP852_REV[c]);
      else arr.push(0x3F); // '?'
    }
    return arr;
  }

  /* ------------------------------------------------------------- DBF ---- */
  // Zwraca { pola:[{nazwa,typ,dlug,dec}], rekordy:[{...}], naglowek, dlugRek, wersja }
  function dbfParse(u8) {
    var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    var nrec = dv.getUint32(4, true);
    var hlen = dv.getUint16(8, true);
    var rlen = dv.getUint16(10, true);
    var pola = [], off = 32;
    while (off < hlen && u8[off] !== 0x0D) {
      var raw = u8.subarray(off, off + 11);
      var nm = cp852Decode(raw).replace(/\u0000/g, "").trim();
      pola.push({ nazwa: nm, typ: String.fromCharCode(u8[off + 11]), dlug: u8[off + 16], dec: u8[off + 17] });
      off += 32;
    }
    var rekordy = [];
    for (var r = 0; r < nrec; r++) {
      var s = hlen + r * rlen;
      if (s + rlen > u8.length) break;
      if (u8[s] === 0x2A) continue; // usunięty
      var p = s + 1, rec = {}, usun = false;
      for (var f = 0; f < pola.length; f++) {
        var fld = pola[f];
        var seg = u8.subarray(p, p + fld.dlug); p += fld.dlug;
        var v = cp852Decode(seg).replace(/\u0000/g, "");
        rec[fld.nazwa] = fld.typ === "C" ? v.replace(/\s+$/, "") : v.trim();
      }
      rec.__usun = usun;
      rekordy.push(rec);
    }
    return { pola: pola, rekordy: rekordy, naglowek: u8.subarray(0, hlen), dlugRek: rlen, wersja: u8[0], ogon: u8.subarray(Math.min(u8.length, hlen + nrec * rlen)) };
  }

  function formatPole(fld, val) {
    val = (val == null ? "" : String(val));
    if (fld.typ === "N" || fld.typ === "F") {
      // Zachowujemy wartość dokładnie tak, jak podał użytkownik / jak była zapisana
      // (bez normalizacji do ustalonej liczby miejsc po przecinku — MIETEK tego nie wymaga)
      val = val.trim().replace(",", ".");
      if (val.length > fld.dlug) val = val.slice(0, fld.dlug);
      while (val.length < fld.dlug) val = " " + val;
      return val;
    }
    if (fld.typ === "L") { val = (val.charAt(0) || " ").toUpperCase(); return val; }
    if (fld.typ === "D") { val = val.replace(/[^0-9]/g, "").slice(0, 8); while (val.length < 8) val += " "; return val; }
    // C — dopełnij spacjami do długości, obetnij
    if (val.length > fld.dlug) val = val.slice(0, fld.dlug);
    while (val.length < fld.dlug) val += " ";
    return val;
  }

  function dbfBuild(parsed, rekordy) {
    var pola = parsed.pola;
    var rlen = 1; for (var i = 0; i < pola.length; i++) rlen += pola[i].dlug;
    var hlen = (parsed.naglowek && parsed.naglowek.length) ? parsed.naglowek.length : (32 + pola.length * 32 + 1);
    var ogon = (parsed.ogon && parsed.ogon.length) ? parsed.ogon : new Uint8Array([0x1A]);
    var total = hlen + rekordy.length * rlen + ogon.length;
    var out = new Uint8Array(total);
    // nagłówek: skopiuj oryginał w całości (zachowuje datę, rezerwy, deskryptory),
    // popraw tylko liczbę rekordów i — na wszelki wypadek — długości
    var head = new Uint8Array(hlen);
    if (parsed.naglowek && parsed.naglowek.length >= hlen) head.set(parsed.naglowek.subarray(0, hlen));
    else {
      head[0] = parsed.wersja || 0x03;
      var now = new Date();
      head[1] = now.getFullYear() - 1900; head[2] = now.getMonth() + 1; head[3] = now.getDate();
      for (var f = 0; f < pola.length; f++) {
        var base = 32 + f * 32, fld = pola[f];
        var nmb = cp852Encode(fld.nazwa);
        for (var k = 0; k < Math.min(11, nmb.length); k++) head[base + k] = nmb[k];
        head[base + 11] = fld.typ.charCodeAt(0);
        head[base + 16] = fld.dlug; head[base + 17] = fld.dec;
      }
      head[hlen - 1] = 0x0D;
    }
    head[4] = rekordy.length & 0xFF; head[5] = (rekordy.length >> 8) & 0xFF;
    head[6] = (rekordy.length >> 16) & 0xFF; head[7] = (rekordy.length >> 24) & 0xFF;
    head[8] = hlen & 0xFF; head[9] = (hlen >> 8) & 0xFF;
    head[10] = rlen & 0xFF; head[11] = (rlen >> 8) & 0xFF;
    out.set(head, 0);
    // rekordy
    var pos = hlen;
    for (var r = 0; r < rekordy.length; r++) {
      out[pos++] = 0x20;
      var rec = rekordy[r];
      for (var ff = 0; ff < pola.length; ff++) {
        var pf = pola[ff];
        var sval = formatPole(pf, rec[pf.nazwa]);
        var bytes = cp852Encode(sval);
        for (var b = 0; b < pf.dlug; b++) out[pos + b] = b < bytes.length ? bytes[b] : 0x20;
        pos += pf.dlug;
      }
    }
    // ogon = bajty za rekordami z oryginału (znacznik EOF 0x1A + ewentualne wypełnienie)
    out.set(ogon, pos);
    return out;
  }

  /* ----------------------------------------------------------- OP_TAX --- */
  var OP_CELL = 35, OP_COLS = 7, OP_LEN = OP_CELL * OP_COLS; // 245

  // Zapakuj listę segmentów do formatu pola (każdy segment = komórka 35 znaków)
  function segmentyNaOptax(segmenty) {
    var out = "";
    for (var i = 0; i < segmenty.length; i++) {
      var s = (segmenty[i] || "").replace(/\s+$/, "");
      if (!s) continue;
      out += s;
      while (out.length % OP_CELL !== 0 && out.length < OP_LEN) out += " ";
    }
    return out.replace(/\s+$/, "");
  }
  // Rozbij zapisane pole na komórki (linie) — po 35 znaków
  function optaxNaKomorki(s) {
    s = s || "";
    var cells = [];
    for (var i = 0; i < s.length && cells.length < OP_COLS; i += OP_CELL) {
      cells.push(s.substr(i, OP_CELL).replace(/\s+$/, ""));
    }
    while (cells.length < OP_COLS) cells.push("");
    return cells;
  }
  // Lista niepustych segmentów (split po średniku, ale z poszanowaniem komórek)
  function optaxNaSegmenty(s) {
    return optaxNaKomorki(s).filter(function (x) { return x.length > 0; });
  }

  // Zakres wieku: do 40 lat różnica 2 (np. 10 -> 8-12), powyżej różnica 5 (np. 75 -> 70-80)
  function zakresWieku(w) {
    w = parseInt(w, 10);
    if (!w) return { lo: "", hi: "" };
    var r = w <= 40 ? 2 : 5;
    return { lo: w - r, hi: w + r };
  }
  // Zakres wiersza: użyj zapisanego lo/hi, a gdy brak — wylicz z wieku
  function zakresRzedu(x) {
    var lo = x.lo, hi = x.hi, w = x.w;
    if ((lo === "" || lo == null || hi === "" || hi == null) && w) { var z = zakresWieku(w); lo = z.lo; hi = z.hi; }
    return { lo: lo == null ? "" : lo, hi: hi == null ? "" : hi, w: w || "" };
  }
  // Grupowanie gatunków po wieku (kolejne o tym samym wieku łączone przecinkiem)
  function grupyDrzewostanu(t) {
    var sk = (t.sklad || []).filter(function (x) { return x.g; });
    var grupy = [];
    sk.forEach(function (x) {
      var key = (x.w || "") + "|" + (x.lo || "") + "|" + (x.hi || "");
      var ost = grupy[grupy.length - 1];
      if (ost && ost.key === key && key !== "||") ost.rows.push(x);
      else grupy.push({ key: key, rows: [x], ref: x });
    });
    return grupy;
  }
  // Jeden segment na grupę wiekową, np. "8So,2Brz/70-80/75l"
  function segmentyDrzewostanu(t) {
    return grupyDrzewostanu(t).map(function (gr) {
      var txt = gr.rows.map(function (x) { var p = (x.p == null || String(x.p).trim() === "") ? "10" : String(x.p).trim(); return p + x.g; }).join(",");
      var z = zakresRzedu(gr.ref);
      if (z.lo !== "" || z.hi !== "" || z.w) {
        return txt + "/" + z.lo + "-" + z.hi + "/" + (z.w || z.hi || z.lo || "") + "l";
      }
      return txt;
    });
  }
  // Podział opisu na pola OP_TAX i OP_TAX1 (nadmiar przechodzi do drugiego pola),
  // cięcie wyłącznie na granicach komórek 35 znaków — żaden tekst nie jest ucinany.
  function opisNaPola(segmenty) {
    var out = "";
    for (var i = 0; i < segmenty.length; i++) {
      var s = (segmenty[i] || "").replace(/\s+$/, "");
      if (!s) continue;
      out += s;
      while (out.length % OP_CELL !== 0) out += " ";
    }
    var a = out.slice(0, OP_LEN).replace(/\s+$/, "");
    var b = out.slice(OP_LEN).replace(/\s+$/, "");
    var calosc = out.replace(/\s+$/, "").length;
    return { optax: a, optax1: b, nadmiar: Math.max(0, calosc - OP_LEN * 2), dlugosc: calosc };
  }
  // Kafelek -> lista segmentów (drzewostan może dać kilka, po jednym na grupę wieku)
  function segmentyZKafelka(t) {
    if (t.t === "drzew") return segmentyDrzewostanu(t);
    var s = zbudujSegment(t);
    return s ? [s] : [];
  }
  // Zbuduj pojedynczy segment z "kafelka" kreatora
  function zbudujSegment(t) {
    switch (t.t) {
      case "stan": return (t.v || "").trim();
      case "przestoje": return (t.v === "Przestoje" ? "Przestoje" : "przestoje");
      case "posusz": return "-posusz";
      case "drzew": return segmentyDrzewostanu(t).join(";");
      case "pjd": {
        var g = (t.gats || []).join(",");
        return "pjd." + g + (t.wiek ? t.wiek : "") + "l";
      }
      case "nalot": {
        var gg = (t.gats || []).join(",");
        return "nalot " + gg + " " + (t.wiek ? t.wiek : "") + "l";
      }

  /* ---------------------------------------------- bonitacja (SBONITA) -- */
  var SBONITA_ROWS = window.MIETEK_SBONITA || [];
  function zbudujBonitacje(rows) {

      if (Array.isArray(r)) { g = r[0]; w = parseInt(r[1], 10); y = parseFloat(r[2]); b = String(r[3] == null ? "" : r[3]).trim(); z = parseInt(r[4], 10); }

      g = String(g == null ? "" : g).trim();
      if (!g || !isFinite(w) || !isFinite(y)) return;
      var byW = idx[g] || (idx[g] = {});
      (byW[w] || (byW[w] = [])).push({ y: y, b: b, z: isFinite(z) ? z : null });
    });
    Object.keys(idx).forEach(function (g) { Object.keys(idx[g]).forEach(function (w) { idx[g][w].sort(function (a, b) { return a.y - b.y; }); }); });

  // Szuka bonitacji i zasobności dla gatunku, wieku i wysokości (najbliższy wiek, potem najbliższa wysokość).
  function bonitacjaDla(gat, wiek, wys) {

    var wkeys = Object.keys(byW).map(Number).sort(function (a, b) { return a - b; });

      if (v && !seen[v]) { seen[v] = 1; var o = document.createElement("option"); o.value = v; dl.appendChild(o); }
    });

  function odswiezStatus() {

    if (!o) { t.textContent = "Brak wczytanych danych."; return; }
    var r = wsieRec();
    var name = r && r.NAZWA ? String(r.NAZWA).trim() : "";

      var parts = String(o.folder || "").replace(/\\/g,"/").split("/").filter(Boolean);

    }

  function odswiezPrzyciski() {
    var d = Object.keys(S.brudne);
    $("#btn-zapisz").disabled = !d.length;
    $("#btn-zapisz").textContent = d.length ? ("Zapisz do DBF (" + d.join(", ") + ")") : "Zapisz do DBF";
  }

  /* ----------------------------------------------- lista wydzieleń ----- */
  function odswiezListeWydz() {
    var box = $("#lista-wydz"); box.innerHTML = "";
    var o = S.aktywny && S.aktywny.pliki.O; if (!o) { box.innerHTML = '<div class="pusto">Brak pliku O (wydzielenia).</div>'; return; }
    var f = S.filtr.toLowerCase();
    o.parsed.rekordy.forEach(function (r) {
      var opis = [r.ODDZIAL, r.PODODDZ].join("");
      var s = (numerPobierz(r) + " " + opis + " " + (r.OP_TAX || "")).toLowerCase();
      if (f && s.indexOf(f) < 0) return;
      var sied = mapaKod("SSIEDLI", r.TYP_SIED);
      var div = el("div", "wydz-item");
      if (S.wybrane && S.wybrane.oddz === r.ODDZIAL && S.wybrane.pod === r.PODODDZ) div.className += " sel";
      div.innerHTML = '<span class="w-nr">' + esc(numerPobierz(r)) + '</span>' +
        '<span class="w-kod">' + esc(opis) + '</span>' +
        '<span class="w-pow">' + fmtNum(r.POW_WYDZ) + ' ha</span>' +
        '<span class="w-sied">' + esc(sied) + ' ' + esc(r.GTD1 || "") + '</span>';
      div.onclick = function () { wybierzWydz(r.ODDZIAL, r.PODODDZ); };
      box.appendChild(div);
    });
  }
  function mapaKod(sl, kod) { var m = slMap(sl); return m[kod] || kod || ""; }
  function fmtNum(x) { if (x == null || x === "") return ""; var n = parseFloat(x); return isNaN(n) ? x : n.toFixed(4); }

  function rekordWydz() {
    var o = S.aktywny && S.aktywny.pliki.O; if (!o || !S.wybrane) return null;
    var idx = o.parsed.rekordy.findIndex(function (r) { return r.ODDZIAL === S.wybrane.oddz && r.PODODDZ === S.wybrane.pod; });
    return idx < 0 ? null : { idx: idx, rec: o.parsed.rekordy[idx] };
  }
  function rekordyR(oddz, pod) {
    var r = S.aktywny && S.aktywny.pliki.R; if (!r) return [];
    return r.parsed.rekordy.map(function (x, i) { return { i: i, rec: x }; })
      .filter(function (x) { return x.rec.ODDZIAL === oddz && x.rec.PODODDZ === pod; });
  }

  /* ====================================================== WIDOK GŁÓWNY == */
  function odswiezWidok() {
    var w = $("#widok");
    var zakl = document.body.dataset.zakl || "taksacja";
    if (zakl === "taksacja") w.innerHTML = widokTaksacja();
    else if (zakl === "rejestr") w.innerHTML = widokRejestr();
    else if (zakl === "wies") w.innerHTML = widokWies();
    else if (zakl === "slowniki") w.innerHTML = widokSlowniki();
    else if (zakl === "wydruk") w.innerHTML = widokWydruk();
    $$(".zakladka").forEach(function (b) { b.classList.toggle("akt", b.dataset.z === zakl); });
    if (typeof poWidoku === "function") poWidoku();
  }

  /* ----------------------------------------------- WIDOK: TAKSACJA ---- */
  function widokTaksacja() {
    var rw = rekordWydz();
    if (!rw) return '<div class="pusto">Wybierz wydzielenie z listy po lewej.</div>';
    var r = rw.rec, h = [];
    h.push('<div class="karta">');
    h.push('<div class="karta-naglowek"><h2>Wydzielenie ' + esc(r.ODDZIAL + r.PODODDZ) + '</h2>' +
      '<span class="pow-badge">' + fmtNum(r.POW_WYDZ) + ' ha</span></div>');
    h.push('<div class="siatka-pol">');
    h.push(pole("NR_PORZ", r, 0), pole("NR_DZIAL", r, 0), pole("ODDZIAL", r, 0), pole("PODODDZ", r, 0), pole("POW_WYDZ", r, 0));
    h.push(pole("TYP_SIED", r, 0), pole("KAT_OCH", r, 0), pole("RODZ_POW", r, 0), pole("CECH_STR", r, 0));
    h.push(pole("GTD1", r, 0), pole("GTD2", r, 0), pole("GTD3", r, 0));
    h.push('</div></div>');
    h.push(builderOpisu(r));
    h.push(tabelaR(r.ODDZIAL, r.PODODDZ));

  }

  // numer porządkowy — NIE zapisywany do DBF, trzymany lokalnie (na kolejny etap)
  function kluczNr(rec) { return (S.aktywny ? S.aktywny.id : "") + ":" + (rec.ODDZIAL || "") + (rec.PODODDZ || ""); }
  function numerPobierz(rec) {
    var k = kluczNr(rec);
    if (!(k in S.numery)) { try { S.numery[k] = localStorage.getItem("mietek_nr:" + k) || ""; } catch (e) { S.numery[k] = ""; } }
    return S.numery[k];
  }
  function numerUstaw(rec, val) {
    var k = kluczNr(rec); S.numery[k] = val;
    try { localStorage.setItem("mietek_nr:" + k, val); } catch (e) { }
    zaplanujZapisNumerow();
  }
  // numer działki — też trzymany lokalnie (wydzielenie nie ma na to pola w DBF),
  // służy do dociągnięcia powierzchni z pliku D.
  function dzialkaPobierz(rec) {
    var k = kluczNr(rec);
    if (!(k in S.dzialki)) { try { S.dzialki[k] = localStorage.getItem("mietek_dzial:" + k) || ""; } catch (e) { S.dzialki[k] = ""; } }
    return S.dzialki[k];
  }
  function dzialkaUstaw(rec, val) {
    var k = kluczNr(rec); S.dzialki[k] = val;
    try { localStorage.setItem("mietek_dzial:" + k, val); } catch (e) { }
    zaplanujZapisNumerow();
  }

  /* MIETEK_NUMERY_FILE_V14 -------------------------------------------------
     Numery porządkowe i numery działek nie mieszczą się w DBF, więc trzymamy je
     w pliku MIETEK_numery.json w tym samym folderze, co pliki DBF — dzięki temu
     jadą razem z danymi na inny komputer i wracają przy wczytaniu folderu. */
  var numeryZPliku = null, numerySciezka = "", numeryTimer = null, numeryCzeka = false;
  function kluczPliku(rec) { return String(rec.ODDZIAL || "") + String(rec.PODODDZ || ""); }
  function rekordyO() { return (S.aktywny && S.aktywny.pliki && S.aktywny.pliki.O) ? S.aktywny.pliki.O.parsed.rekordy : []; }
  function zastosujNumeryZPliku() {
    if (!numeryZPliku) return 0;
    var ile = 0;
    rekordyO().forEach(function (rec) {
      var w = numeryZPliku[kluczPliku(rec)];
      if (!w || typeof w !== "object") return;
      var k = kluczNr(rec);
      if (typeof w.nr === "string" && w.nr) { S.numery[k] = w.nr; try { localStorage.setItem("mietek_nr:" + k, w.nr); } catch (e) { } ile++; }
      if (typeof w.dzialka === "string" && w.dzialka) { S.dzialki[k] = w.dzialka; try { localStorage.setItem("mietek_dzial:" + k, w.dzialka); } catch (e) { } }
    });
    numeryZPliku = null;
    return ile;
  }
  function numeryDoPliku() {
    var out = {};
    rekordyO().forEach(function (rec) {
      var kk = kluczNr(rec), kp = kluczPliku(rec);
      if (!kp) return;
      var nr = (S.numery && S.numery[kk]) || "";
      var dz = (S.dzialki && S.dzialki[kk]) || "";
      if (nr || dz) out[kp] = { nr: nr, dzialka: dz };
    });
    return out;
  }
  function zapiszNumery() {
    if (numeryTimer) { clearTimeout(numeryTimer); numeryTimer = null; }
    numeryCzeka = false;
    if (!window.pywebview || !window.pywebview.api || typeof window.pywebview.api.save_numery !== "function") return Promise.resolve(null);
    return window.pywebview.api.save_numery(numeryDoPliku()).then(function (res) {
      if (res && res.ok) { numerySciezka = res.path || numerySciezka; }
      else if (res && res.error) console.warn("numery: " + res.error);
      return res;
    }).catch(function (e) { console.warn("numery: " + e.message); return null; });
  }
  function zaplanujZapisNumerow() {
    if (!window.pywebview || !window.pywebview.api || typeof window.pywebview.api.save_numery !== "function") return;
    numeryCzeka = true;
    if (numeryTimer) clearTimeout(numeryTimer);
    numeryTimer = setTimeout(zapiszNumery, 900);
  }
  window.addEventListener("beforeunload", function () { zapiszNumery(); });
  // Gdy zmienia się oddział/pododdział, klucz wydzielenia się zmienia — przenieś
  // zapisane lokalnie numery, żeby nie "znikały" (błąd zgłaszany przez użytkownika).
  function przeniesLokalne(stary, nowy) {
    if (!stary || !nowy || stary === nowy) return;
    [["mietek_nr:", "numery"], ["mietek_dzial:", "dzialki"]].forEach(function (pp) {
      var v = null;
      if (S[pp[1]] && stary in S[pp[1]]) v = S[pp[1]][stary];
      if (v == null) { try { v = localStorage.getItem(pp[0] + stary); } catch (e) { } }
      if (v == null || v === "") return;
      if (!S[pp[1]]) S[pp[1]] = {};
      S[pp[1]][nowy] = v;
      try { localStorage.setItem(pp[0] + nowy, v); } catch (e) { }
    });
  }

  function pole(nazwa, rec, idx) {
    if (nazwa === "NR_PORZ") {
      return '<label class="pole"><span title="Trzymany w pliku MIETEK_numery.json obok plików DBF">Numer porządkowy</span><input data-nr="1" value="' + esc(numerPobierz(rec)) + '" placeholder="nr porządkowy"></label>';
    }
    if (nazwa === "NR_DZIAL") {
      return '<label class="pole"><span>Numer działki</span><input data-dzial="1" list="dl-dzial" value="' + esc(dzialkaPobierz(rec)) + '" placeholder="nr działki, np. 1 lub 1,2,3"></label>';
    }
    var sl = POLA_SLOWNIK[nazwa];
    var val = rec[nazwa] == null ? "" : rec[nazwa];
    var inner;
    if (nazwa === "ODDZIAL" || nazwa === "PODODDZ") {
      inner = '<input data-pole="' + nazwa + '" value="' + esc(val) + '">';
    } else if (sl) {
      inner = '<select data-pole="' + nazwa + '">';
      if (sl === "SGATUNA") {
        inner += opt(val, "", "—");
        slGatuna().forEach(function (g) { inner += opt(val, g.kod, g.kod + " — " + g.nazwa); });
      } else {
        inner += opt(val, "", "—");
        opcjeSlownika(sl).forEach(function (x) { inner += opt(val, x.kod, x.kod + " — " + x.nazwa); });
      }
      inner += '</select>';
    } else {
      inner = '<input data-pole="' + nazwa + '" value="' + esc(val) + '">';
    }
    return '<label class="pole"><span>' + lab(nazwa) + '</span>' + inner + '</label>';
  }

  /* --------------------------------------------- BUILDER OP_TAX -------- */
  var TYPY = {
    stan: { label: "Stan / typ powierzchni", opcje: ["Halizna", "Płazowina", "Halizna użyt. jako łąka", "Halizna po nieudanej uprawie", "Zaległy zrąb", "Zalesienie porolne"] },
    drzew: { label: "Drzewostan (skład/wiek)" },
    pjd: { label: "Pojedynczo (pjd.)" },
    nalot: { label: "Nalot" },
    podrost: { label: "Podrost" },
    zmiesz: { label: "Zmieszanie", opcje: ["jedn.", "grup.", "kęp.", "rzęd."] },
    zw: { label: "Zwarcie", opcje: ["przeryw.", "umiark.", "luz.", "pełne", "zwarte"] },
    przestoje: { label: "Przestoje", opcje: ["przestoje", "Przestoje"] },
    posusz: { label: "Posusz (-posusz)" },
    podszyt: { label: "Podszyt" },
    wolny: { label: "Notatki" }
  };
  // roboczy stan kafelków dla bieżącego wydzielenia (opis = OP_TAX + OP_TAX1 razem)
  var TILE = null;

  function kafelkiZPola(txt) {
    var out = [];
    C.optaxNaKomorki(txt).forEach(function (cell) {
      cell.split(";").forEach(function (piece) {
        piece = piece.trim(); if (!piece) return;
        var t = C.parsujSegment(piece); if (t) out.push(t);
      });
    });
    return out;
  }
  function pobierzKafelki(rec) {
    if (TILE == null) {
      // wczytaj cały opis: OP_TAX + kontynuacja z OP_TAX1
      var pelny = (rec.OP_TAX || "").padEnd(C.OP_LEN, " ") + (rec.OP_TAX1 || "");
      TILE = kafelkiZPola(pelny);
    }
    return TILE;
  }

  // Gatunki z kafelka "Drzewostan" w kolejności ze składu (z wiekiem) — do uzupełniania elementów R.
  function gatunkiDrzewostanu(rec) {
    var out = [];
    (pobierzKafelki(rec) || []).forEach(function (t) {
      if (t && t.t === "drzew" && t.sklad) t.sklad.forEach(function (sk) {
        if (sk && sk.g) out.push({ g: String(sk.g).trim(), w: String(sk.w == null ? "" : sk.w).trim() });
      });
    });
    return out;
  }

  function builderOpisu(r) {
    var h = [];
    h.push('<div class="karta">');
    h.push('<div class="karta-naglowek"><h2>Opis taksacyjny</h2>' +
      '<div class="przel"><button class="min" id="btn-nowy-opis">✎ Nowy opis (od zera)</button>' +
      '<button class="min akcja" id="btn-z-r">Wypełnij z elementów (R)</button></div></div>');
    var tiles = pobierzKafelki(r);
    h.push('<div class="builder">');
    // kafelki
    h.push('<div class="kafelki">');
    if (!tiles.length) h.push('<div class="pusto-mini">Brak segmentów. Dodaj poniżej — np. „Drzewostan", „Zwarcie", „Podszyt".</div>');
    tiles.forEach(function (t, i) { h.push(kafelek(t, i)); });
    h.push('</div>');
    // dodawanie
    h.push('<div class="dodaj">Dodaj segment: ');
    Object.keys(TYPY).forEach(function (k) {
      h.push('<button class="chip" data-dodaj="' + k + '">' + esc(TYPY[k].label) + '</button>');
    });
    h.push('</div>');
    // podgląd
    h.push(podgladOpisu(tiles, r));
    h.push('</div></div>');
    return h.join("");
  }

  function kafelek(t, i) {
    var def = TYPY[t.t] || TYPY.wolny;
    var h = ['<div class="kafelek" data-i="' + i + '">'];
    h.push('<div class="kaf-naglowek"><span class="kaf-typ">' + esc(def.label) + '</span>' +
      '<span class="kaf-str">' + esc(C.zbudujSegment(t)) + '</span>' +
      '<span class="kaf-akcje"><button data-move="-1" title="w górę">↑</button>' +
      '<button data-move="1" title="w dół">↓</button>' +
      '<button data-del="1" title="usuń">✕</button></span></div>');
    h.push('<div class="kaf-cialo">');
    if (t.t === "drzew") {
      h.push('<div class="sklad">');
      (t.sklad || []).forEach(function (s, j) {
        var z = C.zakresRzedu(s);
        var zt = (z.lo !== "" || z.hi !== "") ? (z.lo + "–" + z.hi) : "";
        h.push('<div class="sklad-row"><input class="udzial" data-sklad="' + j + '" data-f="p" value="' + esc(s.p || "") + '" placeholder="10" title="udział (puste = 10)">' +
          gatSelect(s.g, 'data-sklad="' + j + '" data-f="g"') +
          '<input class="wiek" data-sklad="' + j + '" data-f="w" value="' + esc(s.w || "") + '" placeholder="wiek" size="4" title="wiek rzeczywisty — zakres uzupełni się sam">' +
          '<span class="zakres">' + esc(zt) + '</span>' +
          '<button data-skdel="' + j + '">✕</button></div>');
      });
      h.push('<button class="min" data-skadd="1">+ gatunek</button></div>');
      h.push('<div class="mini-info">Każdy gatunek ma własny wiek. Wpisujesz jedną liczbę — zakres uzupełni się sam (≤ 40 lat: ±2, powyżej: ±5). Gatunki o tym samym wieku łączą się w jeden wpis.</div>');
    } else if (t.t === "pjd" || t.t === "nalot" || t.t === "podrost") {
      h.push('<div class="wiek-row">gatunki <input data-f="gats" value="' + esc((t.gats || []).join(",")) + '" placeholder="So,Brz" list="dl-gat"> ' +
        'wiek <input data-f="wiek" value="' + esc(t.wiek || "") + '" size="5"> l</div>');
    } else if (def.opcje) {
      h.push('<select data-f="v">');
      def.opcje.forEach(function (o) { h.push(opt(t.v, o, o)); });
      h.push('</select>');
    } else if (t.t === "podszyt") {
      h.push('<div class="wiek-row">pokrycie <input data-f="pct" value="' + esc(t.pct || "") + '" size="5"> % pow.</div>');
    } else if (t.t === "posusz") {
      h.push('<span class="mini-info">segment stały: <code>-posusz</code></span>');
    } else {
      h.push('<input class="szeroki" data-f="v" value="' + esc(t.v || "") + '" placeholder="notatka do opisu">');
    }
    h.push('</div></div>');
    return h.join("");
  }
  function gatSelect(val, attrs) {
    var h = '<select class="gat" ' + (attrs || "") + '>' + opt(val, "", "gat.");
    slGatuna().forEach(function (g) { h += opt(val, g.kod, g.kod); });
    return h + '</select>';
  }

  function podgladOpisu(tiles, r) {
    var segmenty = [];
    tiles.forEach(function (tt) { segmenty = segmenty.concat(C.segmentyZKafelka(tt)); });
    var p = C.opisNaPola(segmenty);
    var k1 = C.optaxNaKomorki(p.optax), k2 = C.optaxNaKomorki(p.optax1);
    var sied = mapaKod("SSIEDLI", r.TYP_SIED);
    var h = ['<div class="podglad">'];
    h.push('<div class="podglad-kol"><h3>Zapis do pól (siatka 7 × 35 znaków)</h3>');
    h.push('<div class="op-etykieta">OP_TAX — opis taksacyjny</div><div class="siatka-op">');
    for (var i = 0; i < C.OP_COLS; i++) {
      var k = k1[i] || "";
      h.push('<div class="op-cell' + (k.length > C.OP_CELL ? " nadmiar" : "") + '"><span class="nr">' + (i + 1) + '</span>' + esc(k) + '</div>');
    }
    h.push('</div>');
    if (p.optax1) {
      h.push('<div class="op-etykieta kont">OP_TAX1 — kontynuacja (nadmiar)</div><div class="siatka-op kont">');
      for (var j = 0; j < C.OP_COLS; j++) {
        var kk = k2[j] || "";
        h.push('<div class="op-cell' + (kk.length > C.OP_CELL ? " nadmiar" : "") + '"><span class="nr">' + (j + 8) + '</span>' + esc(kk) + '</div>');
      }
      h.push('</div>');
    }
    h.push('<div class="dlug">razem ' + p.dlugosc + ' / ' + (C.OP_LEN * 2) + ' znaków' +
      (p.nadmiar > 0 ? ' — <b class="nad">za dużo o ' + p.nadmiar + ' znaków, nie zmieści się w OP_TAX + OP_TAX1!</b>'
                     : (p.optax1 ? ' — nadmiar przechodzi do OP_TAX1' : ' — mieści się w OP_TAX')) + '</div></div>');
    h.push('<div class="podglad-kol"><h3>Podgląd wydruku OPTAX</h3><div class="druk-op">');
    h.push('<div class="dl">' + esc((sied + "    " + (r.GTD1 || "")).padEnd(35)) + '</div>');
    k1.concat(k2).forEach(function (k) { if (k) h.push('<div class="dl">' + esc(k.padEnd(35)) + '</div>'); });
    h.push('</div></div></div>');
    return h.join("");
  }

  /* --------------------------------------------- tabela elementów R ---- */
  function tabelaR(oddz, pod) {
    var rows = rekordyR(oddz, pod);
    var h = ['<div class="karta"><div class="karta-naglowek"><h2>Elementy taksacyjne (R)</h2>' +
      '<button class="min akcja" id="btn-dodaj-r">+ dodaj element</button>' +
      '<button class="min akcja" id="btn-auto-bon" title="Uzupełnij bonitację i zasobność z tablicy SBONITA">⚙ Auto bonitacja</button></div>'];
    h.push('<div class="tabela-wrap"><table class="tabela r-tabela"><thead><tr>' +
      ['Gatunek', 'Wiek', 'Klasa w.', 'Wys [m]', 'Pierś [cm]', 'Bonit.', 'Zadrzew.', 'Jakość', 'Zasobn.', 'Przes.'].map(function (x) { return '<th>' + x + '</th>'; }).join("") +
      '<th colspan="3">Wskazanie 1</th><th colspan="3">Wskazanie 2</th><th></th></tr>' +
      '<tr><th colspan="10"></th><th>Rodzaj</th><th>Pow</th><th>Miąż</th><th>Rodzaj</th><th>Pow</th><th>Miąż</th><th></th></tr>' +
      '</thead><tbody>');
    if (!rows.length) h.push('<tr><td colspan="17" class="pusto-mini">Brak elementów dla tego wydzielenia.</td></tr>');
    rows.forEach(function (x) { h.push(rWiersz(x)); });
    h.push('</tbody></table></div></div>');
    return h.join("");

    if(window.pywebview){alert('Eksport natywny nie jest gotowy. Poczekaj chwilę lub przebuduj EXE po zastosowaniu V11.');return;}
    var a=document.createElement('a');var url=URL.createObjectURL(blob);
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1000);
  }


  /* ----------------------------------------------- mini-ZIP (store) ---- */
  var CRC_TABLE = (function () { var t = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
  function crc32(u8) { var c = 0xFFFFFFFF; for (var i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zbudujZip(entries) {
    var chunks = [], central = [], offset = 0;
    function u16(n) { return [n & 255, (n >> 8) & 255]; }
    function u32(n) { return [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255]; }
    entries.forEach(function (e) {
      var nameB = C.cp852Encode(e.name); // nazwy plików w ASCII/CP852
      nameB = []; for (var i = 0; i < e.name.length; i++) nameB.push(e.name.charCodeAt(i) & 255);
      var data = e.data, crc = crc32(data), sz = data.length;
      var local = [].concat([0x50, 0x4b, 0x03, 0x04], u16(20), u16(0), u16(0), u16(0), u16(0), u32(crc), u32(sz), u32(sz), u16(nameB.length), u16(0), nameB);
      chunks.push(new Uint8Array(local), data);
      central.push([].concat([0x50, 0x4b, 0x01, 0x02], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0), u32(crc), u32(sz), u32(sz), u16(nameB.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), nameB));
      offset += local.length + sz;
    });
    var cdBytes = 0, cdArr = [];
    central.forEach(function (c) { cdArr.push(new Uint8Array(c)); cdBytes += c.length; });
    var end = [].concat([0x50, 0x4b, 0x05, 0x06], u16(0), u16(0), u16(entries.length), u16(entries.length), u32(cdBytes), u32(offset), u16(0));
    var parts = chunks.concat(cdArr, [new Uint8Array(end)]);
    return new Blob(parts, { type: "application/zip" });
  }

  /* ------------------------------------------------- eksport do Excela --- */
  function zbudujXlsx(wiersze, nazwaArkusza) {
    function xe(s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
    function kol(n) { var s = ""; n = n + 1; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
    var body = wiersze.map(function (w, ri) {
      var cells = w.map(function (v, ci) {
        var ref = kol(ci) + (ri + 1);
        if (typeof v === "number" && isFinite(v)) return '<c r="' + ref + '"><v>' + v + '</v></c>';
        return '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xe(v) + '</t></is></c>';
      }).join("");
      return '<row r="' + (ri + 1) + '">' + cells + '</row>';
    }).join("");
    var enc = new TextEncoder();
    var P = {
      "[Content_Types].xml": '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
      "_rels/.rels": '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
      "xl/workbook.xml": '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + xe(nazwaArkusza || "Taksacja") + '" sheetId="1" r:id="rId1"/></sheets></workbook>',
      "xl/_rels/workbook.xml.rels": '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>',
      "xl/worksheets/sheet1.xml": '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' + body + '</sheetData></worksheet>'
    };
    return zbudujZip(Object.keys(P).map(function (k) { return { name: k, data: enc.encode(P[k]) }; }));
  }

  function eksportExcel() {
    var o = S.aktywny; if (!o || !o.pliki.O) { alert("Brak danych do eksportu."); return; }
    var rmap = {};
    (o.pliki.R ? o.pliki.R.parsed.rekordy : []).forEach(function (r) { var k = r.ODDZIAL + r.PODODDZ; (rmap[k] = rmap[k] || []).push(r); });
    var naglowki = ["Numer porządkowy", "Oddział", "Pododdz.", "Pow. [ha]", "Typ siedliska", "Gat. główny", "Wiek", "Klasa wieku", "Bonitacja", "Zadrzewienie", "Opis taksacyjny"];
    var wiersze = [naglowki];
    o.pliki.O.parsed.rekordy.forEach(function (r) {
      var el = rmap[r.ODDZIAL + r.PODODDZ] || [];
      var gl = el.find(function (x) { return x.GATUNEK === r.GTD1; }) || el[0] || {};
      var opis = ((r.OP_TAX || "").padEnd(C.OP_LEN, " ") + (r.OP_TAX1 || "")).replace(/\s+$/, "");
      var linie = C.optaxNaKomorki(opis).filter(Boolean);
      wiersze.push([numerPobierz(r), r.ODDZIAL, r.PODODDZ, (r.POW_WYDZ ? parseFloat(r.POW_WYDZ) : ""),
        mapaKod("SSIEDLI", r.TYP_SIED), r.GTD1 || "", gl.WIEK || "", gl.KL_WIEK || "", gl.BONIT || "", gl.ZADRZEW || "",
        linie.join("\n")]);
    });
    pobierz(zbudujXlsx(wiersze, "Taksacja"), "MIETEK_eksport_" + o.nazwa.replace(/[\\/:*?"<>|]/g, "_") + ".xlsx");
  }

  /* ============================================================ BOOT == */
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

  window.MietekApp = { S: S, wczytajPliki: wczytajPliki, generujRaport: generujRaport, RAPORTY: RAPORTY, zapiszTxt: zapiszTxt };
})();
